<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅读 - 简单阅读</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="light" data-page="reader">
<div class="container">
    <nav class="top-nav">
        <div class="nav-brand"><h1>简单阅读</h1></div>
        <div class="nav-actions">
            <button id="themeBtn" class="nav-btn" onclick="toggleTheme()">夜间</button>
            <button class="nav-btn primary" onclick="openSettingModal()">设置</button>
        </div>
    </nav>

    <div class="reader-view">
        <div class="reader-head">
            <button class="back-btn" onclick="backToHome()">返回书架</button>
            <h2 class="reader-title" id="readerTitle">加载中</h2>
        </div>
        <div class="reader-meta" id="readerMeta"></div>

        <div class="reader-tools">
            <span>字号</span>
            <button class="tool-btn" onclick="changeFontSize(-2)">A-</button>
            <button class="tool-btn" onclick="changeFontSize(2)">A+</button>
        </div>

        <div id="reader-content"></div>

        <div class="reader-nav">
            <button id="prevChBtn" class="tool-btn">上一章</button>
            <button id="tocBtn" class="tool-btn toc-link">目录</button>
            <button id="nextChBtn" class="tool-btn">下一章</button>
            <span id="pageInfo" class="page-info">第 1 章 / 共 1 章</span>
        </div>
    </div>
</div>

<div class="setting-modal" id="settingModal">
    <div class="setting-box">
        <div class="setting-header">
            <h2>阅读设置</h2>
            <button class="close-setting" onclick="closeSettingModal()">×</button>
        </div>
        <div class="setting-item">
            <label>默认字号</label>
            <select id="setFontSize">
                <option value="16">16px</option>
                <option value="18">18px</option>
                <option value="20">20px</option>
                <option value="22">22px</option>
            </select>
        </div>
        <div class="setting-item">
            <label>默认行距</label>
            <select id="setLineHeight">
                <option value="1.6">紧凑 1.6</option>
                <option value="1.8">标准 1.8</option>
                <option value="2.0">宽松 2.0</option>
            </select>
        </div>
        <div class="setting-item">
            <label>页边距</label>
            <select id="setPageMargin">
                <option value="12">紧凑 12px</option>
                <option value="24">标准 24px</option>
                <option value="40">宽松 40px</option>
            </select>
        </div>
        <button class="save-setting-btn" onclick="saveGlobalSettings()">保存设置</button>
    </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="app.js"></script>
</body>
</html>
