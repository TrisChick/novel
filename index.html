<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简单阅读</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<script src="https://cdn.bootcdn.net/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
:root{
    --accent:#2563eb; --accent-2:#3b82f6; --accent-soft:rgba(37,99,235,0.10);
    --bg:#f4f8ff; --card:#ffffff; --glass-bg:rgba(255,255,255,0.92); --glass-border:rgba(37,99,235,0.12);
    --text:#1f2a44; --sub:#5b6b8c; --border:rgba(37,99,235,0.14);
    --reader-bg:#ffffff; --reader-text:#2a3550;
    --shadow:0 8px 26px rgba(37,99,235,0.10);
    --radius-lg:22px; --radius-md:16px; --radius-pill:9999px;
    --transition:0.25s ease;
}
body[data-theme="sepia"]{
    --bg:#eef4fd; --glass-bg:rgba(255,255,255,0.9); --glass-border:rgba(37,99,235,0.1);
    --text:#22304f; --sub:#5f6f93; --border:rgba(37,99,235,0.12);
    --reader-bg:#f6faff; --reader-text:#2a3550;
    --shadow:0 8px 26px rgba(37,99,235,0.08);
}
body[data-theme="dark"]{
    --bg:#0b1220; --glass-bg:rgba(20,30,50,0.9); --glass-border:rgba(96,165,250,0.18);
    --text:#dbe6f5; --sub:#8fa2c0; --border:rgba(96,165,250,0.16);
    --reader-bg:#101a2e; --reader-text:#dbe6f5;
    --shadow:0 8px 26px rgba(0,0,0,0.5);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;background:var(--bg);color:var(--text);padding:16px;transition:var(--transition);
}
.container{max-width:860px;margin:0 auto}

.top-nav{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
    padding:16px 20px;margin-bottom:18px;background:var(--glass-bg);border:1px solid var(--glass-border);
    border-radius:var(--radius-lg);box-shadow:var(--shadow);position:sticky;top:8px;z-index:20;backdrop-filter:blur(10px);
}
.nav-brand h1{font-size:1.5rem;font-weight:800;color:var(--accent)}
.nav-links{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.theme-btn{padding:7px 16px;border:1px solid var(--glass-border);border-radius:var(--radius-pill);background:transparent;color:var(--sub);cursor:pointer;transition:var(--transition);font-size:0.85rem}
.theme-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.theme-btn:hover{background:var(--accent-soft);color:var(--accent)}

.search-bar{width:100%;margin-bottom:16px;display:flex;gap:10px;align-items:center;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-pill);padding:6px 6px 6px 18px;box-shadow:var(--shadow)}
#searchInput{flex:1;padding:10px 8px;border:none;background:transparent;color:var(--text);font-size:0.95rem;outline:none}
#searchInput::placeholder{color:var(--sub)}
#searchBtn,#resetBtn{padding:10px 20px;border-radius:var(--radius-pill);cursor:pointer;transition:var(--transition);font-weight:500;border:none;font-size:0.88rem}
#searchBtn{background:var(--accent);color:#fff}
#searchBtn:hover{background:var(--accent-2)}
#resetBtn{border:1px solid var(--glass-border);background:transparent;color:var(--text)}
#resetBtn:hover{background:var(--accent-soft)}

.action-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.mode-switch{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mode-btn{padding:10px 18px;border:1px solid var(--glass-border);border-radius:var(--radius-md);background:var(--glass-bg);color:var(--text);cursor:pointer;font-size:0.88rem;transition:var(--transition)}
.mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.mode-btn:hover{background:var(--accent-soft);color:var(--accent)}

.status-tip{text-align:center;color:var(--sub);padding:10px;margin-bottom:18px;font-size:0.95rem}
.loader{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:24px auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 书籍列表 */
.book-list{display:flex;flex-direction:column;gap:12px}
.book-item{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-md);padding:18px 20px;cursor:pointer;transition:var(--transition);box-shadow:var(--shadow)}
.book-item:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 12px 30px rgba(37,99,235,0.14)}
.book-item-title{font-size:1.12rem;font-weight:700;color:var(--text);margin-bottom:6px}
.book-item-meta{font-size:0.85rem;color:var(--sub)}

/* 书籍详情 + 目录 */
.detail-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.back-btn{background:transparent;border:1px solid var(--glass-border);color:var(--accent);padding:9px 20px;border-radius:var(--radius-md);cursor:pointer;transition:var(--transition);font-size:0.9rem}
.back-btn:hover{background:var(--accent);color:#fff}
.detail-title{font-size:1.5rem;font-weight:800;color:var(--accent)}
.detail-meta{text-align:center;color:var(--sub);margin-bottom:22px;line-height:1.7;font-size:0.95rem}
.toc-list{display:flex;flex-direction:column;gap:8px}
.toc-item{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:12px;padding:14px 18px;cursor:pointer;transition:var(--transition);font-size:0.98rem;color:var(--text)}
.toc-item:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.toc-item.chapter-done{opacity:0.7}

/* 阅读视图 */
.reader-view{background:var(--reader-bg);border:1px solid var(--glass-border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:28px;margin-top:14px}
.reader-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.reader-title{font-size:1.4rem;font-weight:800;color:var(--accent)}
.reader-meta{text-align:center;color:var(--sub);margin-bottom:20px;line-height:1.7;font-size:0.9rem}
.reader-settings{display:flex;flex-wrap:wrap;gap:14px;padding:16px 18px;background:var(--accent-soft);border-radius:var(--radius-md);margin-bottom:24px;border:1px solid var(--border);align-items:center}
.reader-settings span{color:var(--sub);font-size:0.9rem;white-space:nowrap}
.setting-btn-sm{padding:8px 14px;border:1px solid var(--glass-border);border-radius:10px;background:var(--glass-bg);color:var(--text);cursor:pointer;font-size:0.85rem;transition:var(--transition)}
.setting-btn-sm:hover{background:var(--accent);color:#fff}
.setting-btn-sm.active{background:var(--accent);color:#fff;border-color:var(--accent)}
#pageWordCount{width:90px;padding:8px 12px;border:1px solid var(--glass-border);border-radius:10px;background:var(--glass-bg);color:var(--text);font-size:0.9rem;outline:none;text-align:center}
#pageWordCount:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#reader-content{line-height:1.9;word-break:break-word;padding:10px 0;color:var(--reader-text);font-size:18px}
#reader-content h1,#reader-content h2,#reader-content h3{color:var(--accent);margin:18px 0 10px}
#reader-content p{margin-bottom:14px;text-indent:2em}
#reader-content pre{background:rgba(37,99,235,0.06);padding:14px;border-radius:8px;margin:12px 0;overflow-x:auto}
#reader-content code{background:rgba(37,99,235,0.06);padding:2px 6px;border-radius:4px;font-size:0.9em}
.page-control{display:flex;gap:16px;justify-content:center;align-items:center;margin-top:24px;padding-top:16px;border-top:1px solid var(--border)}
.page-info{color:var(--sub);font-size:0.9rem}

/* 设置弹窗 */
.setting-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(11,18,32,0.5);z-index:999;display:none;align-items:center;justify-content:center}
.setting-box{width:92%;max-width:600px;background:var(--glass-bg);border-radius:var(--radius-lg);padding:28px;border:1px solid var(--glass-border);box-shadow:0 20px 60px rgba(0,0,0,0.25);animation:modalIn 0.3s ease}
@keyframes modalIn{from{transform:scale(0.96) translateY(16px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.setting-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.setting-header h2{margin:0;color:var(--accent);font-weight:800;font-size:1.3rem}
.close-setting{background:transparent;border:none;font-size:1.6rem;cursor:pointer;color:var(--sub);width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:var(--transition)}
.close-setting:hover{background:var(--accent);color:#fff}
.setting-item{margin-bottom:20px}
.setting-item label{display:block;margin-bottom:8px;color:var(--sub);font-weight:500;font-size:0.92rem}
.setting-item select,.setting-item input{width:100%;padding:12px 16px;border:1px solid var(--glass-border);border-radius:12px;background:var(--glass-bg);color:var(--text);font-size:0.95rem;transition:var(--transition);outline:none}
.setting-item select:focus,.setting-item input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.save-setting-btn{margin-top:8px;width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:14px;font-size:1rem;font-weight:700;cursor:pointer;transition:var(--transition)}
.save-setting-btn:hover{background:var(--accent-2)}
.error-tip{color:#dc2626;background:rgba(220,38,38,0.1);padding:16px 20px;border-radius:12px;margin:20px 0;text-align:center;border:1px solid rgba(220,38,38,0.2)}

/* 移动端适配 */
@media(max-width:640px){
    body{padding:12px}
    .top-nav{flex-direction:column;text-align:center;padding:14px}
    .action-bar{flex-direction:column;align-items:stretch}
    .mode-switch{justify-content:center}
    .nav-links{justify-content:center}
    #searchInput{font-size:1rem}
    .reader-view{padding:18px}
    .reader-title{font-size:1.15rem}
    .reader-settings{gap:10px;padding:14px}
    .setting-box{padding:22px}
    .toc-item{padding:16px}
}
</style>
</head>
<body data-theme="light">
<div class="container">
    <nav class="top-nav">
        <div class="nav-brand"><h1>简单阅读</h1></div>
        <div class="nav-links">
            <button class="theme-btn" data-theme="light" onclick="setTheme('light',this)">日间</button>
            <button class="theme-btn" data-theme="sepia" onclick="setTheme('sepia',this)">护眼</button>
            <button class="theme-btn" data-theme="dark" onclick="setTheme('dark',this)">夜间</button>
        </div>
    </nav>

    <div class="search-bar">
        <input id="searchInput" placeholder="搜索书名 / 作者 / 章节">
        <button id="searchBtn" onclick="doSearch()">搜索</button>
        <button id="resetBtn" onclick="resetSearch()">重置</button>
    </div>

    <div class="action-bar">
        <div class="mode-switch">
            <button class="mode-btn active" data-sort="name" onclick="changeSortMode('name',this)">书名排序</button>
            <button class="mode-btn" data-sort="natural" onclick="changeSortMode('natural',this)">章节排序</button>
        </div>
        <button class="mode-btn" onclick="openSettingModal()">设置</button>
    </div>

    <div id="statusTip" class="status-tip">加载中</div>
    <div id="loader" class="loader" style="display:none"></div>

    <!-- 书籍列表 -->
    <div id="bookList" class="book-list"></div>

    <!-- 书籍详情 + 目录 -->
    <div id="bookDetail" style="display:none">
        <div class="detail-header">
            <button class="back-btn" onclick="backToBooks()">返回书架</button>
            <h2 class="detail-title" id="detailTitle"></h2>
        </div>
        <div class="detail-meta" id="detailMeta"></div>
        <div id="tocList" class="toc-list"></div>
    </div>

    <!-- 阅读视图 -->
    <div id="readerView" style="display:none">
        <div class="reader-view">
            <div class="reader-header">
                <button class="back-btn" onclick="backToDetail()">返回目录</button>
                <h2 class="reader-title" id="readerTitle"></h2>
            </div>
            <div class="reader-meta" id="readerMeta"></div>

            <div class="reader-settings">
                <span>阅读模式</span>
                <button class="setting-btn-sm active" data-readmode="scroll" onclick="switchReadMode('scroll',this)">滚动</button>
                <button class="setting-btn-sm" data-readmode="page" onclick="switchReadMode('page',this)">分页</button>
                <span>单页字数</span>
                <input type="number" id="pageWordCount" value="1200" min="400" max="3000" onchange="updatePagination()">
                <span>字号</span>
                <button class="setting-btn-sm" onclick="changeFontSize(-2)">A-</button>
                <button class="setting-btn-sm" onclick="changeFontSize(2)">A+</button>
            </div>

            <div id="reader-content"></div>

            <div class="page-control" id="pageControl" style="display:none">
                <button class="setting-btn-sm" onclick="prevPage()">上一页</button>
                <span class="page-info" id="pageInfo">第 1 页 / 共 1 页</span>
                <button class="setting-btn-sm" onclick="nextPage()">下一页</button>
            </div>
        </div>
    </div>
</div>

<!-- 全局设置弹窗 -->
<div class="setting-modal" id="settingModal">
    <div class="setting-box">
        <div class="setting-header">
            <h2>阅读设置</h2>
            <button class="close-setting" onclick="closeSettingModal()">×</button>
        </div>
        <div class="setting-item">
            <label>默认字号</label>
            <select id="setFontSize">
                <option value="16">16px</option>
                <option value="18" selected>18px</option>
                <option value="20">20px</option>
                <option value="22">22px</option>
            </select>
        </div>
        <div class="setting-item">
            <label>默认行距</label>
            <select id="setLineHeight">
                <option value="1.6">紧凑 1.6</option>
                <option value="1.8" selected>标准 1.8</option>
                <option value="2.0">宽松 2.0</option>
            </select>
        </div>
        <div class="setting-item">
            <label>默认主题</label>
            <select id="setDefaultTheme">
                <option value="light" selected>日间模式</option>
                <option value="sepia">护眼模式</option>
                <option value="dark">夜间模式</option>
            </select>
        </div>
        <div class="setting-item">
            <label>分页默认字数</label>
            <input type="number" id="setDefaultWords" value="1200" min="400" max="3000">
        </div>
        <button class="save-setting-btn" onclick="saveGlobalSettings()">保存设置</button>
    </div>
</div>

<script>
// ===================== 全局配置 =====================
const CONFIG = {
    GH_USER: "TrisChick",
    GH_REPO: "novel",
    GH_BRANCH: "main",
    GH_API: "https://api.github.com/repos",
    CDN_BASE: "https://cdn.jsdelivr.net/gh/TrisChick/novel@main/",
    SORT_PATH: "novel/sort.json",
    MAX_CONCURRENT: 6,
    STORAGE_KEY: "simple_reader_setting"
};

let allNovels = [];        // 所有章节
let filterNovels = [];     // 过滤后的章节
let currentSortMode = "name";
let currentBook = null;    // 当前打开的书
let currentBookChapters = [];
let currentNovel = null;   // 当前章节
let currentPage = 1;
let totalPages = 1;
let pageContents = [];
let fontSize = 18;

const $ = id => document.getElementById(id);
const statusTip = $("statusTip");
const loader = $("loader");
const bookListEl = $("bookList");
const searchInput = $("searchInput");

// ===================== 工具函数 =====================
function encodePath(p) { return encodeURI(p) }

function naturalSort(a, b) {
    const reg = /(\d+)/g;
    const arrA = (a.fileName || a).split(reg);
    const arrB = (b.fileName || b).split(reg);
    for (let i = 0; i < Math.max(arrA.length, arrB.length); i++) {
        const valA = arrA[i] || "";
        const valB = arrB[i] || "";
        const numA = parseInt(valA);
        const numB = parseInt(valB);
        if (!isNaN(numA) && !isNaN(numB)) {
            if (numA !== numB) return numA - numB;
        } else {
            const cmp = String(valA).localeCompare(String(valB), "zh-CN");
            if (cmp !== 0) return cmp;
        }
    }
    return 0;
}

function showStatus(text) { statusTip.textContent = text }
function showError(text) { statusTip.innerHTML = `<div class="error-tip">${text}</div>` }

// ===================== 数据读取 =====================
async function loadSortConfig() {
    try {
        const timestamp = Date.now();
        const url = `${CONFIG.GH_API}/${CONFIG.GH_USER}/${CONFIG.GH_REPO}/contents/${CONFIG.SORT_PATH}?t=${timestamp}`;
        const res = await fetch(url, { headers: { "Accept": "application/vnd.github.raw" } });
        if (!res.ok) return [];
        const raw = await res.text();
        const json = JSON.parse(raw);
        return Array.isArray(json.order) ? json.order : [];
    } catch (e) {
        console.warn("读取排序配置失败：", e.message);
        return [];
    }
}

async function fetchRepoTree() {
    const url = `${CONFIG.GH_API}/${CONFIG.GH_USER}/${CONFIG.GH_REPO}/git/trees/${CONFIG.GH_BRANCH}?recursive=1`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`仓库访问失败：HTTP ${res.status}`);
    const data = await res.json();
    return data.tree || [];
}

async function batchLoadNovels(fileList) {
    const results = [];
    let loaded = 0;
    const total = fileList.length;
    async function worker() {
        while (fileList.length > 0) {
            const filePath = fileList.shift();
            try {
                const cdnUrl = CONFIG.CDN_BASE + encodePath(filePath);
                const res = await fetch(cdnUrl);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const rawText = await res.text();
                const metaMatch = rawText.match(/<!--\s*ZW_META:\s*(\{[\s\S]*?\})\s*-->/);
                let meta = { title: "", author: "", book: "未分类" };
                if (metaMatch) { try { meta = JSON.parse(metaMatch[1]); } catch(e) {} }
                const fileName = filePath.split("/").pop();
                const pathParts = filePath.replace("novel/", "").split("/");
                const bookName = pathParts.length >= 2 ? pathParts[0] : "未分类";
                results.push({
                    path: filePath,
                    fileName: fileName,
                    title: meta.title || fileName.replace(/\.(md|txt)$/i, ""),
                    author: meta.author || "佚名",
                    book: meta.book || bookName,
                    content: rawText.replace(/<!--\s*ZW_META:[\s\S]*?-->\s*/, "").trim(),
                    rawContent: rawText
                });
            } catch (e) {
                console.warn(`跳过加载失败文件：${filePath}`, e.message);
            }
            loaded++;
            showStatus(`加载中 (${loaded}/${total})`);
        }
    }
    const workers = [];
    const concurrency = Math.min(CONFIG.MAX_CONCURRENT, total);
    for (let i = 0; i < concurrency; i++) workers.push(worker());
    await Promise.all(workers);
    return results;
}

async function loadAllData() {
    loader.style.display = "block";
    showStatus("加载中");
    try {
        const [tree, sortConfig] = await Promise.all([fetchRepoTree(), loadSortConfig()]);
        const novelFiles = tree
            .filter(item => {
                const path = item.path;
                const name = path.split("/").pop();
                return item.type === "blob"
                    && path.startsWith("novel/")
                    && !name.startsWith(".")
                    && /\.(md|txt)$/i.test(name)
                    && name !== "sort.json";
            })
            .map(item => item.path);
        if (novelFiles.length === 0) {
            showStatus("当前暂无书籍，敬请期待");
            loader.style.display = "none";
            renderBookList();
            return;
        }
        allNovels = await batchLoadNovels(novelFiles);
        filterNovels = [...allNovels];
        showStatus(`共 ${allNovels.length} 个章节`);
        renderBookList();
    } catch (e) {
        console.error("加载失败:", e);
        showError(`加载失败：${e.message}，请检查网络或仓库配置`);
    } finally {
        loader.style.display = "none";
    }
}

// ===================== 书籍分组与渲染 =====================
function groupBooks(list) {
    const map = {};
    list.forEach(n => {
        if (!map[n.book]) map[n.book] = [];
        map[n.book].push(n);
    });
    return map;
}

function sortBookNames(names) {
    const arr = [...names];
    if (currentSortMode === "name") {
        arr.sort((a, b) => a.localeCompare(b, "zh-CN"));
    } else {
        arr.sort((a, b) => { return naturalSort({ fileName: a }, { fileName: b }); });
    }
    return arr;
}

function renderBookList() {
    const map = groupBooks(filterNovels);
    const names = sortBookNames(Object.keys(map));
    bookListEl.innerHTML = "";
    if (names.length === 0) {
        const empty = document.createElement("div");
        empty.className = "status-tip";
        empty.textContent = "没有找到匹配的书籍";
        bookListEl.appendChild(empty);
        return;
    }
    names.forEach(name => {
        const chapters = map[name];
        const author = chapters[0].author;
        const item = document.createElement("div");
        item.className = "book-item";
        const t = document.createElement("div");
        t.className = "book-item-title";
        t.textContent = name;
        const m = document.createElement("div");
        m.className = "book-item-meta";
        m.textContent = `作者：${author}　共 ${chapters.length} 章`;
        item.appendChild(t);
        item.appendChild(m);
        item.onclick = () => openBook(name);
        bookListEl.appendChild(item);
    });
}

// ===================== 书籍详情 + 目录 =====================
function openBook(name) {
    currentBook = name;
    const chapters = [...(groupBooks(allNovels)[name] || [])];
    // 章节按自然顺序排列
    chapters.sort((a, b) => naturalSort(a, b));
    currentBookChapters = chapters;
    $("detailTitle").textContent = name;
    const author = chapters[0] ? chapters[0].author : "佚名";
    $("detailMeta").textContent = `作者：${author}　共 ${chapters.length} 章`;
    const toc = $("tocList");
    toc.innerHTML = "";
    chapters.forEach(ch => {
        const item = document.createElement("div");
        item.className = "toc-item";
        item.textContent = ch.title;
        item.onclick = () => openReader(ch);
        toc.appendChild(item);
    });
    bookListEl.style.display = "none";
    $("bookDetail").style.display = "block";
    $("readerView").style.display = "none";
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function backToBooks() {
    $("bookDetail").style.display = "none";
    bookListEl.style.display = "";
    currentBook = null;
    currentBookChapters = [];
}

// ===================== 阅读功能 =====================
function openReader(novel) {
    currentNovel = novel;
    $("readerTitle").textContent = novel.title;
    $("readerMeta").textContent = `书籍：${novel.book}　作者：${novel.author}`;
    $("reader-content").innerHTML = marked.parse(novel.content);
    $("reader-content").style.fontSize = fontSize + "px";
    currentPage = 1;
    $("pageControl").style.display = "none";
    $("bookDetail").style.display = "none";
    $("readerView").style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function backToDetail() {
    $("readerView").style.display = "none";
    $("bookDetail").style.display = "block";
    currentNovel = null;
}

function switchReadMode(mode, btn) {
    document.querySelectorAll("[data-readmode]").forEach(b => b.classList.remove("active"));
    if (btn) btn.classList.add("active");
    if (mode === "scroll") {
        if (currentNovel) $("reader-content").innerHTML = marked.parse(currentNovel.content);
        $("pageControl").style.display = "none";
    } else {
        updatePagination();
        $("pageControl").style.display = "flex";
        renderCurrentPage();
    }
}

function updatePagination() {
    if (!currentNovel) return;
    const wordsPerPage = parseInt($("pageWordCount").value) || 1200;
    const text = currentNovel.content;
    pageContents = [];
    let current = "";
    let count = 0;
    const paragraphs = text.split("\n\n");
    paragraphs.forEach(p => {
        const len = p.length;
        if (count + len > wordsPerPage && current.length > 0) {
            pageContents.push(current);
            current = p;
            count = len;
        } else {
            current += (current ? "\n\n" : "") + p;
            count += len;
        }
    });
    if (current.trim()) pageContents.push(current);
    totalPages = pageContents.length;
    currentPage = 1;
    renderCurrentPage();
}

function renderCurrentPage() {
    if (pageContents.length === 0) return;
    $("reader-content").innerHTML = marked.parse(pageContents[currentPage - 1]);
    $("reader-content").style.fontSize = fontSize + "px";
    $("pageInfo").textContent = `第 ${currentPage} 页 / 共 ${totalPages} 页`;
}

function prevPage() {
    if (currentPage > 1) { currentPage--; renderCurrentPage(); window.scrollTo({ top: 0, behavior: "smooth" }); }
}
function nextPage() {
    if (currentPage < totalPages) { currentPage++; renderCurrentPage(); window.scrollTo({ top: 0, behavior: "smooth" }); }
}
function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(28, fontSize + delta));
    $("reader-content").style.fontSize = fontSize + "px";
}

// ===================== 搜索与排序 =====================
function doSearch() {
    const keyword = searchInput.value.trim().toLowerCase();
    if (!keyword) {
        filterNovels = [...allNovels];
    } else {
        filterNovels = allNovels.filter(n =>
            n.title.toLowerCase().includes(keyword)
            || n.author.toLowerCase().includes(keyword)
            || n.book.toLowerCase().includes(keyword)
            || n.content.toLowerCase().includes(keyword)
        );
    }
    renderBookList();
}

function resetSearch() {
    searchInput.value = "";
    filterNovels = [...allNovels];
    renderBookList();
}

function changeSortMode(mode, btn) {
    currentSortMode = mode;
    document.querySelectorAll("[data-sort]").forEach(b => b.classList.remove("active"));
    if (btn) btn.classList.add("active");
    renderBookList();
}

searchInput.addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });

// ===================== 主题与设置 =====================
function setTheme(theme, btn) {
    document.body.dataset.theme = theme;
    document.querySelectorAll("[data-theme]").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(`[data-theme="${theme}"]`).forEach(b => b.classList.add("active"));
    saveSettingToLocal();
}

function openSettingModal() {
    $("settingModal").style.display = "flex";
    $("setFontSize").value = fontSize;
    $("setDefaultTheme").value = document.body.dataset.theme;
    $("setDefaultWords").value = $("pageWordCount").value;
}

function closeSettingModal() { $("settingModal").style.display = "none"; }

function saveGlobalSettings() {
    fontSize = parseInt($("setFontSize").value);
    $("pageWordCount").value = $("setDefaultWords").value;
    setTheme($("setDefaultTheme").value);
    if (currentNovel) {
        $("reader-content").style.fontSize = fontSize + "px";
        const modeBtn = document.querySelector("[data-readmode].active");
        if (modeBtn && modeBtn.dataset.readmode === "page") updatePagination();
    }
    saveSettingToLocal();
    closeSettingModal();
    showStatus("设置已保存");
}

function saveSettingToLocal() {
    const setting = {
        theme: document.body.dataset.theme,
        fontSize: fontSize,
        pageWords: parseInt($("pageWordCount").value)
    };
    localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(setting));
}

function loadSettingFromLocal() {
    try {
        const saved = localStorage.getItem(CONFIG.STORAGE_KEY);
        if (!saved) return;
        const setting = JSON.parse(saved);
        if (setting.theme) setTheme(setting.theme);
        if (setting.fontSize) fontSize = setting.fontSize;
        if (setting.pageWords) $("pageWordCount").value = setting.pageWords;
    } catch(e) {}
}

// ===================== 初始化 =====================
window.onload = () => { loadSettingFromLocal(); loadAllData(); };
$("settingModal").addEventListener("click", e => { if (e.target.id === "settingModal") closeSettingModal(); });
</script>
