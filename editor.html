<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中梧小说 - 编辑器</title>
    <style>
        :root { --bg-color:#eef1ff; --text-color:#2c2f3a; --glass-bg:rgba(255,255,255,0.6); --glass-border:rgba(255,255,255,0.8); --accent:#6366f1; --accent-2:#a855f7; --accent-grad:linear-gradient(135deg,#6366f1,#a855f7); --shadow:0 12px 36px rgba(70,80,160,0.12); --blur:blur(20px) saturate(180%); }
        [data-theme="dark"] { --bg-color:#0e0e13; --text-color:#e6e6ee; --glass-bg:rgba(38,38,46,0.55); --glass-border:rgba(255,255,255,0.12); --accent:#818cf8; --accent-2:#c084fc; --shadow:0 12px 36px rgba(0,0,0,0.5); }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: system-ui; background: var(--bg-color); color: var(--text-color); min-height: 100vh; padding: 30px; position: relative; overflow-x: hidden; }
        body::before,body::after { content:''; position:fixed; z-index:-1; border-radius:50%; filter:blur(90px); opacity:.5; pointer-events:none; }
        body::before { width:55vw; height:55vw; top:-20vw; left:-15vw; background:radial-gradient(circle,#a5b4fc,#e0aaff 60%,transparent 72%); }
        body::after { width:50vw; height:50vw; bottom:-20vw; right:-12vw; background:radial-gradient(circle,#fbcfe8,#bae6fd 60%,transparent 72%); }
        body[data-theme="dark"]::before { opacity:.3; }
        body[data-theme="dark"]::after { opacity:.26; }
        .editor-container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        input, textarea {
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border);
            background: var(--glass-bg); color: var(--text-color); font-size: 16px; outline: none;
            backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
        }
        input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.25); }
        textarea { height: 60vh; resize: vertical; font-family: inherit; line-height: 1.6; }
        .actions { display: flex; gap: 10px; justify-content: flex-end; }
        button {
            padding: 10px 20px; border-radius: 12px; border: 1px solid var(--glass-border);
            background: var(--glass-bg); color: var(--text-color); cursor: pointer; font-size: 14px;
            backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); transition: 0.2s;
        }
        button:hover { background: var(--accent-grad); color: #fff; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(99,102,241,0.4); }
        h1 { background: var(--accent-grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
    </style>
</head>
<body>
    <div class="editor-container">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h1>写小说</h1>
            <a href="index.html" style="color:var(--text-color); text-decoration:none;">返回首页</a>
        </div>
        <input type="text" id="novel-title" placeholder="小说名称">
        <input type="text" id="novel-author" placeholder="作者名称">
        <textarea id="novel-content" placeholder="在此开始你的创作..."></textarea>
        <div class="actions">
            <button onclick="exportNovel('txt')">导出 TXT</button>
            <button onclick="exportNovel('md')">导出 MD</button>
            <button onclick="exportNovel('html')">导出 HTML</button>
        </div>
    </div>

    <script>
        function getPrefs() {
            return JSON.parse(localStorage.getItem('zw_prefs') || JSON.stringify({
                fontSize: 18, lineHeight: 1.8, bgColor: '#121212'
            }));
        }

        function exportNovel(type) {
            const title = document.getElementById('novel-title').value.trim() || '未命名小说';
            const author = document.getElementById('novel-author').value.trim() || '未知作者';
            const content = document.getElementById('novel-content').value;
            const prefs = getPrefs();
            
            // 注入元数据
            const metaData = { ...prefs, title, author };
            const metaStr = `<!-- ZW_META:${JSON.stringify(metaData)} -->\n`;
            
            let finalContent = '', mime = '';
            if (type === 'txt') {
                finalContent = metaStr + `《${title}》\n作者：${author}\n\n${content}`;
                mime = 'text/plain';
            } else if (type === 'md') {
                finalContent = metaStr + `# 《${title}》\n**作者**：${author}\n\n${content}`;
                mime = 'text/markdown';
            } else {
                finalContent = metaStr + `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${title}</title></head><body><h1>《${title}》</h1><p>作者：${author}</p><div>${content.replace(/\n/g, '<br>')}</div></body></html>`;
                mime = 'text/html';
            }

            const blob = new Blob([finalContent], { type: `${mime};charset=utf-8` });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${title}.${type}`;
            a.click();
        }
    </script>
</body>
</html>
