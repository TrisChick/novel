name: Auto import novels from _inbox

on:
  push:
    branches: [main]
    paths: ['_inbox/*.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Import inbox txt
        shell: bash
        run: |
          set -e
          imported=0
          for f in _inbox/*.txt; do
            [ -e "$f" ] || continue
            echo "===== 导入 $f ====="
            node tools/import_novel.mjs "$f"
            imported=1
            rm -f "$f"
          done
          if [ "$imported" = "0" ]; then
            echo "没有待导入的 .txt，结束。"
            exit 0
          fi

      - name: Commit and push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变更，跳过提交"
            exit 0
          fi
          git commit -m "auto-import: novel(s) from _inbox"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:main
